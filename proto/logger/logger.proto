syntax = "proto3";

option java_multiple_files = true;
option java_package = "bazel.bootcamp";
option java_outer_classname = "GreeterProto";
option go_package = "bootcamp/proto/logger";

package logger;

service Logger {
  rpc SendLogMessage(LogMessage) returns (Empty) {}
}

message LogMessage {
  string message = 1;
  int64 time = 2;
}

message Empty {}
